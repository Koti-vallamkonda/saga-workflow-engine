const TYPES={trigger:{c:'#0284c7',d:{kind:'manual',event:'my.event',everySec:60}},action:{c:'#4338ca',d:{service:'http',url:'',method:'GET',headers:'{}',payload:'',compensateUrl:'',undo:true,retries:2,backoff:300,failTimes:0}},condition:{c:'#b45309',d:{expr:'body.vip'}},delay:{c:'#7c3aed',d:{seconds:1}},script:{c:'#047857',d:{code:'return {total: 1};',timeoutMs:1000}},ask:{c:'#c2410c',d:{message:'What should we use?',field:'answer'}},notify:{c:'#0f766e',d:{message:'Workflow reached this step: {{input.name}}'}},approval:{c:'#be185d',d:{message:'Approve this step?'}},end:{c:'#475569',d:{}}};
const N=(id,type,x,y,name,data={})=>({id,type,x,y,name,data:{...TYPES[type].d,...data}});
const E=(...ids)=>ids.slice(1).map((to,i)=>({from:ids[i],to}));
const SAMPLES={
'Order saga (compensation)':()=>({input:'{"failPayment":true}',nodes:[N('t','trigger',20,170,'Order created'),N('a','action',210,170,'Reserve stock',{service:'inventory'}),N('b','action',400,170,'Charge payment',{service:'payment'}),N('c','action',590,170,'Send email',{service:'email',undo:false}),N('e','end',790,170,'Done')],edges:E('t','a','b','c','e')}),
'Script: price an order':()=>({input:'{"items":[{"price":30,"qty":2},{"price":50,"qty":1}]}',nodes:[N('t','trigger',20,170,'Order priced',{event:'order.priced'}),N('s','script',210,170,'Add up order',{code:"const total = input.items.reduce((s,i)=>s+i.price*i.qty,0);\nconsole.log('total is '+total);\nreturn {total, vip: total>100};"}),N('c','condition',410,170,'Is VIP?'),N('v','action',610,70,'VIP email',{service:'email',undo:false}),N('n','action',610,270,'Normal email',{service:'email',undo:false}),N('e','end',810,170,'Done')],edges:[{from:'t',to:'s'},{from:'s',to:'c'},{from:'c',to:'v',label:'true'},{from:'c',to:'n',label:'false'},{from:'v',to:'e'},{from:'n',to:'e'}]}),
'Flaky service (retry)':()=>({input:'{}',nodes:[N('t','trigger',20,170,'Start',{event:'job.start'}),N('a','action',230,170,'Call flaky API',{service:'flaky',failTimes:2,retries:3,undo:false}),N('e','end',450,170,'Done')],edges:E('t','a','e')})};
function addSample(name){const s=SAMPLES[name](),w={id:rid('wf_'),name:name.replace(/ \(.*/,''),input:s.input,nodes:s.nodes,edges:s.edges};T().wfs.push(w);cur=w.id;sel=null;save();return w}
const wf=()=>T().wfs.find(w=>w.id===cur);
/* ---------- validator ---------- */
function validate(w){const er=[],bad=new Set(),add=(m,id)=>{er.push(m);id&&bad.add(id)},rg=(v,a,b)=>+v>=a&&+v<=b;
 const tr=w.nodes.filter(n=>n.type==='trigger');if(tr.length!==1)add('Exactly one Trigger node is needed');
 if(!w.nodes.some(n=>n.type==='end'))add('Add at least one End node');
 w.nodes.forEach(n=>{const d=n.data,out=w.edges.filter(e=>e.from===n.id),inn=w.edges.filter(e=>e.to===n.id),nm=`"${n.name}"`;
  if(n.type!=='end'&&!out.length)add(`${nm}: connect it to a next node`,n.id);
  if(n.type!=='trigger'&&!inn.length)add(`${nm}: nothing leads into this node`,n.id);
  if(n.type==='condition'){if(!out.some(e=>e.label==='true')||!out.some(e=>e.label==='false'))add(`${nm}: needs a true and a false branch`,n.id);if(!String(d.expr).trim())add(`${nm}: write a condition`,n.id)}
  if(n.type==='trigger'&&d.kind==='schedule'&&!rg(d.everySec,5,86400))add(`${nm}: interval must be 5 to 86400 seconds`,n.id);if(n.type==='trigger'&&d.kind==='event'&&!String(d.event||'').trim())add(`${nm}: enter an event name`,n.id);if((n.type==='notify'||n.type==='approval'||n.type==='ask')&&!String(d.message).trim())add(`${nm}: write a message`,n.id);if(n.type==='action'&&d.service==='http'&&!/^(https?:\/\/|\{\{)/i.test(String(d.url||'').trim()))add(`${nm}: enter a valid URL (http or https)`,n.id);
  if(n.type==='action'){if(!rg(d.retries,0,5))add(`${nm}: retries must be 0 to 5`,n.id);if(!rg(d.backoff,50,10000))add(`${nm}: wait must be 50 to 10000 ms`,n.id)}
  if(n.type==='script'){if(!String(d.code).trim())add(`${nm}: write the script code`,n.id);else if(d.code.length>5000)add(`${nm}: script too long (5000 chars max)`,n.id);if(!rg(d.timeoutMs,50,5000))add(`${nm}: time limit must be 50 to 5000 ms`,n.id)}
  if(n.type==='delay'&&!(+d.seconds>0))add(`${nm}: delay must be above 0`,n.id)});
 const st={};let cyc=false;const dfs=id=>{st[id]=1;w.edges.filter(e=>e.from===id).forEach(e=>{if(st[e.to]===1)cyc=true;else if(!st[e.to])dfs(e.to)});st[id]=2};
 tr[0]&&dfs(tr[0].id);if(cyc)add('The workflow has a loop (it must be a DAG)');
 if(tr[0])w.nodes.forEach(n=>{if(!st[n.id]&&n.type!=='trigger')add(`"${n.name}": cannot be reached from the Trigger`,n.id)});
 return{errors:er,bad}}
/* ---------- script sandbox: Web Worker + time limit ---------- */
const WSRC=`onmessage=e=>{const{code,input,previous}=e.data,logs=[];try{for(const k of['fetch','XMLHttpRequest','WebSocket','importScripts','indexedDB','postMessage_'])try{self[k]=undefined}catch(x){}
const fn=new Function('input','previous','console','"use strict";'+code);const r=fn(input,previous,{log:(...a)=>logs.push(a.join(' '))});
const txt=JSON.stringify(r===undefined?null:r);if(txt.length>100000)throw new Error('result too big');postMessage({ok:true,result:JSON.parse(txt),logs})}catch(err){postMessage({ok:false,error:err.message})}}`;
function runScript(code,input,previous,ms){return new Promise((res,rej)=>{let w;
 try{w=new Worker(URL.createObjectURL(new Blob([WSRC],{type:'text/javascript'})))}catch(e){return rej(new Error('worker not available here'))}
 const kill=setTimeout(()=>{w.terminate();rej(new Error(`timed out after ${ms} ms (worker killed)`))},ms);
 w.onmessage=e=>{clearTimeout(kill);w.terminate();e.data.ok?res(e.data):rej(new Error(e.data.error))};
 w.onerror=e=>{clearTimeout(kill);w.terminate();rej(new Error(e.message||'script crashed'))};
 w.postMessage({code,input,previous})})}
/* ---------- engine ---------- */
async function callService(d,ctx,attempt){if(d.service==='http')return httpCall(d,ctx);await sleep(250);const i=ctx.input||{};
 if(d.service==='payment'&&i.failPayment)throw new Error('Payment declined (402)');
 if(d.service==='inventory'&&i.outOfStock)throw new Error('Out of stock (409)');
 if(d.service==='flaky'&&attempt<=+d.failTimes)throw new Error('Service unavailable (503)');
 return{service:d.service,ok:true,ref:rid('')}}
async function runNode(n,ctx,log){const d=n.data;
 if(n.type==='trigger')return{msg:d.kind==='schedule'?'scheduled run':d.kind==='event'?'event '+d.event:'manual start'};
 if(n.type==='notify'){const m=tpl(d.message,ctx);toast(m);return{msg:'notified: '+m}}
 if(n.type==='approval'){const m=tpl(d.message,ctx);if(!await askApproval(m,n.name))throw new Error('Rejected by approver');return{msg:'approved'}}
 if(n.type==='ask'){const v=await askInput(tpl(d.message,ctx),n.name),f=String(d.field||'answer').trim()||'answer';ctx.input={...(ctx.input||{}),[f]:v};ctx.body={[f]:v};return{msg:`${f} = ${v}`}}
 if(n.type==='end')return{msg:'finished'};
 if(n.type==='delay'){await sleep(d.seconds*1000);return{msg:`waited ${d.seconds}s`}}
 if(n.type==='condition'){let v;try{v=!!new Function('input','body','return ('+d.expr+')')(ctx.input,ctx.body)}catch(e){throw new Error('Condition error: '+e.message)}return{branch:v,msg:`${d.expr} is ${v}`}}
 if(n.type==='script'){try{const o=await runScript(d.code,ctx.input,ctx.body,+d.timeoutMs);ctx.body=o.result;return{msg:'result '+JSON.stringify(o.result)+(o.logs.length?' | log: '+o.logs.join('; '):'')}}catch(e){throw new Error('Script failed: '+e.message)}}
 let tries=0;for(;;){tries++;try{ctx.body=await callService(d,ctx,tries);return{msg:`${d.service} ok after ${tries} attempt(s)`}}
  catch(e){if(tries>+d.retries)throw new Error(`${e.message} (tried ${tries} time${tries>1?'s':''})`);log(n,'retry',`attempt ${tries} failed: ${e.message}, waiting ${d.backoff*2**(tries-1)} ms`);await sleep(d.backoff*2**(tries-1))}}}
async function exec(w,input,live){
 const run={id:rid('run_'),wf:w.id,name:w.name,status:'running',input,steps:[],at:Date.now()};
 const log=(n,s,m)=>{const st={node:n.id,name:n.name,status:s,msg:m,t:Date.now()-run.at};run.steps.push(st);if(live){nodeState[n.id]=s;trace.push(st);paint()}};
 RUNNING++;const ctx={input,body:null},done=[];let n=w.nodes.find(x=>x.type==='trigger'),g=0;
 try{while(n&&g++<60){log(n,'running','started');const r=await runNode(n,ctx,log);log(n,'done',r.msg);
   if(n.type==='action'&&n.data.undo)done.push(n);if(n.type==='end')break;
   const outs=w.edges.filter(e=>e.from===n.id),e=n.type==='condition'?outs.find(e=>e.label===String(r.branch)):outs[0];n=e&&w.nodes.find(x=>x.id===e.to)}
  run.status='completed'}
 catch(err){log(n,'failed',err.message);run.error=err.message;run.failedNode=n.name;
  for(const d of done.reverse()){await sleep(200);let m='undo '+d.data.service;if(d.data.service==='http'){if(d.data.compensateUrl){try{await fetch(tpl(d.data.compensateUrl,ctx),{method:'POST'});m='undo call sent to '+tpl(d.data.compensateUrl,ctx)}catch(e){m='undo call failed: '+e.message}}else m='no undo URL set, skipped'}log(d,'compensated',m)}
  run.status=done.length?'compensated':'failed';
  T().dead.unshift({id:rid('dl_'),run:run.id,wf:w.id,name:w.name,reason:err.message,node:n.name,input,status:'open',at:Date.now()})}
 RUNNING--;run.ms=Date.now()-run.at;T().runs.unshift(run);save();toast(`${run.name}: ${run.status}`,run.status==='completed'?'ok':'bad');return run}

const nav=[['dash','Dashboard'],['des','Workflows'],['runs','Executions'],['events','Events'],['ana','Analytics'],['dead','Failed runs'],['keys','API Keys'],['tenants','Tenants'],['set','Settings'],['logs','Logs']];

const tag=s=>`<span class="tag ${s}">${s}</span>`;
function dash(){const r=T().runs,c=s=>r.filter(x=>x.status===s).length,mx=Math.max(1,r.length);
 $('#view').innerHTML=`<div class="hero"><div><h2>Welcome back, ${esc(me().name)}</h2><p>${T().wfs.length} workflow(s) in ${esc(S.tenant)}. Build your own steps, write your own text.</p></div><button class="pri" data-v="des">Open designer</button></div><div class="kpis"><div class="kpi"><b>${T().wfs.length}</b><span>workflows</span></div><div class="kpi"><b>${r.length}</b><span>runs</span></div><div class="kpi"><b class="completed">${c('completed')}</b><span>completed</span></div><div class="kpi"><b class="compensated">${c('compensated')}</b><span>rolled back</span></div><div class="kpi"><b class="failed">${c('failed')}</b><span>failed</span></div><div class="kpi"><b>${T().dead.filter(d=>d.status==='open').length}</b><span>open dead letters</span></div></div>
 <div class="grid2"><div class="box"><h2>Runs by status (${esc(S.tenant)})</h2>${['completed','compensated','failed'].map(s=>`<div class="bar"><span>${s}</span><i class="${s}" style="width:${c(s)/mx*100}%;background:currentColor"></i><b>${c(s)}</b></div>`).join('')}<p class="mu">Each tenant has its own workflows, runs and dead letters. Switch tenant at the top right.</p></div>
 <div class="box"><h2>Recent runs</h2>${r.length?`<table><tr><th>Workflow</th><th>Status</th><th>Time</th></tr>${r.slice(0,6).map(x=>`<tr><td>${esc(x.name)}</td><td>${tag(x.status)}</td><td>${x.ms} ms</td></tr>`).join('')}</table>`:'<p class="mu">No runs yet. Build a workflow in the Designer and press Run.</p>'}</div></div>`}
function designer(){const w=wf();
 const opts=T().wfs.map(x=>`<option value="${x.id}" ${x.id===cur?'selected':''}>${esc(x.name)}</option>`).join('');
 $('#view').innerHTML=`<div class="tools"><select id="wsel">${opts}</select><button id="newwf">New</button>${w?`<input id="wname" value="${esc(w.name)}" style="width:170px" title="Workflow name">`:''}<select id="samp"><option value="">Start from template...</option>${Object.keys(SAMPLES).map(k=>`<option>${k}</option>`).join('')}</select>
 ${Object.keys(TYPES).map(t=>`<button data-add="${t}">+ ${ICON[t]} ${t}</button>`).join('')}${w&&w.nodes.some(x=>x.type==='trigger'&&x.data.kind==='schedule')?`<button id="act" class="${w.active?'on':''}">Schedule: ${w.active?'on':'off'}</button>`:''}<button id="dup">Duplicate</button><button id="val">Validate</button><button class="pri" id="runb">Run</button><input id="evn" placeholder="event name" style="width:130px"><button id="fire">Fire event</button>${isAdmin()?'<button class="dng" id="delwf">Delete</button>':''}</div>
 ${w?`<div class="designer"><div><div id="cv"><div id="plane"><svg id="edges"></svg>${w.nodes.map(nodeHtml).join('')}</div></div>
 <div class="tools" style="margin-top:8px"><label class="mu" style="flex:1">Run input (JSON, or just type text: use it as {{input.text}})<input id="inp" value='${esc(w.input||'{}')}'></label></div>
 <div id="note">${note}</div><div id="trace" class="box" ${trace.length?'':'hidden'}>${trace.map(t=>`<div><span class="${t.status}">${t.status}</span> ${esc(t.name)}: ${esc(t.msg)}</div>`).join('')}</div></div>
 <div class="box" id="panel"></div></div>`:'<div class="box"><h2>No workflows yet</h2><p class="mu">Press New to start from a blank canvas, or choose a template.</p></div>'}`;
 if(w){drawEdges();panel();$('#trace').scrollTop=1e5}}
function nodeHtml(n){const ports=n.type==='condition'?`<i class="p out t ${link&&link.from===n.id&&link.label==='true'?'on':''}" data-p="true" title="true branch"></i><i class="p out f ${link&&link.from===n.id&&link.label==='false'?'on':''}" data-p="false" title="false branch"></i>`:n.type==='end'?'':`<i class="p out ${link&&link.from===n.id?'on':''}" data-p=""></i>`;
 const sub=n.type==='action'?n.data.service+(n.data.undo?' + undo':''):n.type==='trigger'?(n.data.kind||'manual')+(n.data.kind==='event'?' '+n.data.event:n.data.kind==='schedule'?' every '+n.data.everySec+'s':''):n.type==='condition'?n.data.expr:n.type==='delay'?n.data.seconds+' s':n.type==='script'?'sandboxed JS':'';
 return`<div class="node ${n.id===sel?'sel':''} ${nodeState[n.id]?'s-'+nodeState[n.id]:''}" data-id="${n.id}" style="--c:${TYPES[n.type].c};left:${n.x}px;top:${n.y}px"><span class="ic">${ICON[n.type]}</span><input class="nm" data-nn value="${esc(n.name)}" placeholder="Type a name" title="Click and type to rename"><input class="ds" data-ns value="${esc(n.sub||'')}" placeholder="${esc(n.type+' '+sub)}" title="Click and write your own text">${ports}</div>`}
function drawEdges(){const w=wf();$('#edges').innerHTML=w.edges.map((e,i)=>{const a=w.nodes.find(n=>n.id===e.from),b=w.nodes.find(n=>n.id===e.to);if(!a||!b)return'';
 const x1=a.x+170,y1=a.y+(a.type==='condition'?(e.label==='true'?18:42):30),x2=b.x,y2=b.y+30,dx=Math.max(40,Math.abs(x2-x1)/2);
 return`<path class="edge ${e.label||''}" data-e="${i}" d="M${x1} ${y1}C${x1+dx} ${y1},${x2-dx} ${y2},${x2} ${y2}"><title>Click to remove</title></path>`}).join('')}
function panel(){const w=wf(),n=w.nodes.find(x=>x.id===sel),p=$('#panel');if(!n){p.innerHTML='<h2>Node settings</h2><p class="mu">Click a node to edit it. Drag to move. To connect: click a round port, then click the target node. Click a line to remove it.</p>';return}

document.addEventListener('click',async e=>{const t=e.target,q=s=>t.closest(s);
 if(q('#out')){logout()}
 else if(q('#act')){const w=wf();w.active=!w.active;save();syncTimers();toast('Schedule '+(w.active?'on: it runs while this tab stays open':'off'));designer()}

 else if(q('#fire')){const ev=$('#evn').value.trim();let p;try{p=JSON.parse($('#inp').value||'{}')}catch(x){p={text:$('#inp').value}}const ms=T().wfs.filter(w=>w.nodes.some(n=>n.type==='trigger'&&n.data.kind==='event'&&n.data.event===ev));if(!ms.length)return toast('No workflow listens to "'+ev+'"','bad');toast(`Event "${ev}" started ${ms.length} workflow(s)`);ms.forEach(w=>exec(w,p,false).then(()=>paintNav()))}
 else if(q('[data-v]')){view=q('[data-v]').dataset.v;paint()}

 else if(q('[data-rep]')){const d=T().dead.find(x=>x.id===q('[data-rep]').dataset.rep),w=T().wfs.find(x=>x.id===d.wf);if(!w)return;d.status='replayed';const r=await exec(w,d.input,false);selRun=r.id;save();deadView()}
 else if(q('[data-res]')){T().dead.find(x=>x.id===q('[data-res]').dataset.res).status='resolved';save();paint()}
 else if(q('[data-add]')){const w=wf();if(!w)return;const ty=q('[data-add]').dataset.add,n=N(rid('n'),ty,30+w.nodes.length*14%200,20+w.nodes.length*30%300,ty[0].toUpperCase()+ty.slice(1));w.nodes.push(n);sel=n.id;save();designer()}
 else if(q('#newwf')){const w={id:rid('wf_'),name:'Workflow '+(T().wfs.length+1),input:'{}',nodes:[N('t','trigger',40,160,'Start')],edges:[]};T().wfs.push(w);cur=w.id;save();designer()}

 const io=new IntersectionObserver(es=>es.forEach(x=>x.isIntersecting&&x.target.classList.add('in')),{threshold:.12});L.querySelectorAll('.rv').forEach(el=>io.observe(el))}
function dash2(){const r=T().runs,w=T().wfs,c=s=>r.filter(x=>x.status===s).length,last=r[0],nodes=(w.find(x=>x.id===(last&&last.wf))||w[0]||{nodes:[]}).nodes;
 const fl=last?last.steps.filter(s=>s.status==='done'||s.status==='failed'):nodes.filter(n=>n.type!=='end').map(n=>({node:n.id,name:n.name,status:'idle'})),cp=last?last.steps.filter(s=>s.status==='compensated'):[],ty=id=>(nodes.find(n=>n.id===id)||{}).type;
 const flow=fl.length?fl.map((s,i)=>`<div class="stp ${s.status}"><i>${ICON[ty(s.node)]||'•'}</i><b>${esc(s.name)}</b><small>Step ${i+1}</small></div>${i<fl.length-1?'<span class="arr">→</span>':''}`).join(''):'<p class="mu">No workflow yet. Create one in Workflows.</p>';
 const comp=cp.length?`<div class="comp"><span class="mu">Compensation</span>${cp.map(s=>`<div class="stp compensated"><i>↩</i><b>${esc(s.name)}</b></div>`).join('')}</div>`:'';
 const pts=r.slice(0,24).reverse().map(x=>x.ms),mx=Math.max(1,...pts),poly=pts.map((v,i)=>`${i*(200/Math.max(1,pts.length-1))},${46-v/mx*40}`).join(' '),bad=r.length?c('failed')/r.length:0;
 $('#view').innerHTML=`<h2 class="ov">Overview</h2><div class="kpis">${[['Total Workflows',w.length,'▣','var(--ac)'],['Running Executions',RUNNING,'▶','var(--ok)'],['Completed',c('completed'),'✓','#38bdf8'],['Failed',c('failed'),'✕','var(--er)']].map(([l,v,g,col])=>`<div class="kpi"><span>${l}</span><div class="kr"><b>${v}</b><em class="gi" style="color:${col}">${g}</em></div></div>`).join('')}</div>
 <div class="dg"><div class="box"><div class="rowb"><h2>Workflow Execution</h2>${last?tag(last.status):'<span class="tag">idle</span>'}</div><div class="flow">${flow}</div>${comp}<p class="mu" style="margin-top:14px">${last?`Execution ID: ${last.id} · ${new Date(last.at).toLocaleString()} · ${last.ms} ms`:'Run a workflow to see its execution here.'}</p></div>
 <div style="display:grid;gap:12px;align-content:start"><div class="box"><div class="rowb"><h2>Recent Executions</h2><button data-v="runs" style="padding:2px 8px">View all</button></div>${r.length?r.slice(0,5).map(x=>`<div class="rec"><span class="dot ${x.status}"></span>${esc(x.name)}<span class="tag ${x.status}">${x.status}</span></div>`).join(''):'<p class="mu">Nothing yet.</p>'}</div>
 <div class="box"><h2>System Health</h2><b>${bad>.2?'Degraded: many failures':'All Systems Operational'}</b><svg viewBox="0 0 200 50" width="100%" height="60"><polyline points="${poly||'0,46 200,46'}" fill="none" stroke="var(--ok)" stroke-width="2"/></svg></div></div></div>`}
function eventsV(){const evs=T().wfs.flatMap(w=>w.nodes.filter(n=>n.type==='trigger'&&n.data.kind==='event').map(n=>({ev:n.data.event,w:w.name}))),h=T().events||[];
 $('#view').innerHTML=`<h2 class="ov">Events</h2><div class="grid2"><div class="box"><h2>Event triggers</h2>${evs.length?`<table><tr><th>Event</th><th>Workflow</th><th></th></tr>${evs.map(e=>`<tr><td>${esc(e.ev)}</td><td>${esc(e.w)}</td><td><button data-fev="${esc(e.ev)}">Fire</button></td></tr>`).join('')}</table>`:'<p class="mu">No workflow listens to events yet. In Workflows, set a Trigger kind to event and name it.</p>'}<div class="fld" style="margin-top:12px"><label>Fire a custom event</label><input id="evn2" placeholder="event name"></div><div class="fld"><label>Payload (JSON or plain text)</label><textarea id="evp" style="min-height:70px">{}</textarea></div><button class="pri" id="evgo">Fire event</button></div><div class="box"><h2>Event history</h2>${h.length?`<table><tr><th>When</th><th>Event</th><th>Started</th></tr>${h.slice(0,20).map(x=>`<tr><td>${new Date(x.at).toLocaleTimeString()}</td><td>${esc(x.ev)}</td><td>${x.n}</td></tr>`).join('')}</table>`:'<p class="mu">No events fired yet.</p>'}</div></div>`}
function keysV(){const k=T().keys||[];$('#view').innerHTML=`<h2 class="ov">API Keys</h2><div class="box"><div class="tools"><input id="kname" placeholder="Key name, e.g. Production" style="max-width:260px"><button class="pri" id="newkey">Generate key</button></div><table><tr><th>Name</th><th>Key</th><th>Created</th><th></th></tr>${k.map(x=>`<tr><td>${esc(x.name)}</td><td><code>${x.key.slice(0,9)}••••••••${x.key.slice(-4)}</code></td><td>${new Date(x.at).toLocaleDateString()}</td><td><button data-ck="${x.id}">Copy</button> ${isAdmin()?`<button class="dng" data-rk="${x.id}">Revoke</button>`:''}</td></tr>`).join('')}</table><p class="mu">Send a key as an x-api-key header in an HTTP action so your services can identify this workspace.</p></div>`}
function tenantsV(){const us=Object.entries(S.users).filter(([,u])=>u.tenant===S.tenant),kp=(l,v)=>`<div class="kpi"><span>${l}</span><div class="kr"><b>${v}</b></div></div>`;
 $('#view').innerHTML=`<h2 class="ov">Tenants</h2><div class="kpis">${kp('Workspace',esc(S.tenant))}${kp('Members',us.length)}${kp('Workflows',T().wfs.length)}${kp('Executions',T().runs.length)}</div><div class="box"><h2>Members</h2><table><tr><th>Name</th><th>Email</th><th>Role</th><th></th></tr>${us.map(([m,u])=>`<tr><td>${esc(u.name)}</td><td>${esc(m)}</td><td><span class="tag">${u.role}</span></td><td>${isAdmin()&&m!==S.me?`<button data-role="${esc(m)}">${u.role==='admin'?'Make member':'Make admin'}</button> <button class="dng" data-rm="${esc(m)}">Remove</button>`:''}</td></tr>`).join('')}</table></div>`}
function settingsV(){$('#view').innerHTML=`<h2 class="ov">Settings</h2><div class="grid2"><div class="box"><h2>Profile</h2><div class="fld"><label>Display name</label><input id="pname" value="${esc(me().name)}"></div><button class="pri" id="psave">Save</button><h2 style="margin-top:18px">Theme</h2><div class="tools">${['dark','light','ocean','violet'].map(t=>`<button data-th="${t}" class="${S.theme===t?'on':''}">${t}</button>`).join('')}</div></div><div class="box"><h2>Workspace data</h2><div class="fld"><label>Export workflows (JSON)</label><textarea readonly>${esc(JSON.stringify(T().wfs,null,1))}</textarea></div><div class="fld"><label>Import workflows (paste JSON)</label><textarea id="impj"></textarea></div><button id="impgo">Import</button> ${isAdmin()?'<button class="dng" id="clr2">Clear executions</button>':''}</div></div>`}
function logsV(){const L=T().logs||[];$('#view').innerHTML=`<h2 class="ov">Logs</h2><div class="box">${L.length?`<table><tr><th>Time</th><th>Level</th><th>Message</th></tr>${L.map(x=>`<tr><td>${new Date(x.at).toLocaleString()}</td><td><span class="tag ${x.k==='ok'?'completed':'failed'}">${x.k==='ok'?'info':'error'}</span></td><td>${esc(x.m)}</td></tr>`).join('')}</table>`:'<p class="mu">No log entries yet.</p>'}</div>`}
document.addEventListener('click',e=>{const t=e.target,q=s=>t.closest(s);
 if(q('[data-go]'))go(q('[data-go]').dataset.go);
 else if(q('[data-auth]'))showLogin(q('[data-auth]').dataset.auth);
 else if(q('[data-cyc]')){const l=['dark','light','ocean','violet'];setTheme(l[(l.indexOf(S.theme)+1)%4])}
 else if(q('[data-closelogin]'))$('#login').hidden=true;
 else if(q('[data-fev]'))fireEvent(q('[data-fev]').dataset.fev,pl($('#evp')&&$('#evp').value));
 else if(q('#evgo')){fireEvent($('#evn2').value.trim(),pl($('#evp').value));eventsV()}
 else if(q('#newkey')){newKey($('#kname').value.trim()||'Key');toast('API key generated');keysV();paintNav()}
 else if(q('[data-ck]'))copyText(T().keys.find(k=>k.id===q('[data-ck]').dataset.ck).key);
 else if(q('[data-rk]')){T().keys=T().keys.filter(k=>k.id!==q('[data-rk]').dataset.rk);save();keysV();paintNav()}
 else if(q('#cpk'))copyText(((T().keys||[])[0]||{}).key||'');
 else if(q('[data-role]')){const u=S.users[q('[data-role]').dataset.role];u.role=u.role==='admin'?'member':'admin';save();tenantsV()}
 else if(q('[data-rm]')){delete S.users[q('[data-rm]').dataset.rm];save();tenantsV()}
 else if(q('#psave')){S.users[S.me].name=$('#pname').value.trim()||me().name;save();paintNav();toast('Profile saved')}
 else if(q('[data-th]')){setTheme(q('[data-th]').dataset.th);settingsV()}
 else if(q('#impgo')){try{const a=JSON.parse($('#impj').value);(Array.isArray(a)?a:[a]).forEach(w=>{w.id=rid('wf_');T().wfs.push(w)});save();toast('Workflows imported');settingsV()}catch(x){toast('Not valid workflow JSON','bad')}}
 else if(q('#clr2')){T().runs=[];T().dead=[];save();toast('Executions cleared');paintNav()}});
const timers=[];
function syncTimers(){timers.splice(0).forEach(clearInterval);if(!S.me)return;T().wfs.forEach(w=>{const t=w.nodes.find(x=>x.type==='trigger');if(w.active&&t&&t.data.kind==='schedule'&&+t.data.everySec>=5)timers.push(setInterval(()=>{let i={};try{i=JSON.parse(w.input||'{}')}catch(e){}exec(w,i,false).then(()=>{['dash','ana','runs'].includes(view)?paint():paintNav()})},t.data.everySec*1000))})}
document.addEventListener('dblclick',e=>{const b=e.target.closest('.node b');if(!b)return;const n=wf().nodes.find(x=>x.id===b.parentNode.dataset.id),i=document.createElement('input');i.value=n.name;i.style.cssText='height:20px;padding:0 4px;font-weight:700';b.replaceWith(i);i.focus();i.select();const ok=()=>{n.name=i.value.trim()||n.name;save();designer()};i.onblur=ok;i.onkeydown=ev=>{if(ev.key==='Enter')i.blur();if(ev.key==='Escape'){i.onblur=null;designer()}};i.onpointerdown=ev=>ev.stopPropagation()});
document.addEventListener('keydown',e=>{if(view==='des'&&sel&&!['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)&&(e.key==='Delete'||e.key==='Backspace')){const w=wf();w.nodes=w.nodes.filter(n=>n.id!==sel);w.edges=w.edges.filter(x=>x.from!==sel&&x.to!==sel);sel=null;save();designer()}});
(async()=>{S.users=S.users||{};
 S.theme=S.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=S.theme;save();S.me&&S.users[S.me]?enter():showLand()})();
